services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: cctv_prometheus
    restart: unless-stopped
    ports:
      # Keep Prometheus private to the host. The frontend reads it through
      # FastAPI's /prometheus-api proxy, not by calling port 9090 directly.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      # Lets Prometheus scrape the host machine on Linux (host.docker.internal -> host gateway)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prom_data:
