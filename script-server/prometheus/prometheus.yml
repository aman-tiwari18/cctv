global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: cctv

# Mounted into the cctv_prometheus container as /etc/prometheus/prometheus.yml.
# Reload after editing (no restart):  curl -X POST http://127.0.0.1:9090/-/reload
#
# fleet-* jobs: servers added with Fleet -> Add server. Prometheus reads them from the
# backend registry (http_sd), so a new server is scraped within a minute of enrolling
# and a retired one drops out — no edit here. The backend answers direct calls from
# this host's Docker bridge only (fleetEnroll.prometheusAuthorized): no token needed.
# The static jobs below are the servers set up by hand before the Fleet page.
scrape_configs:
  - job_name: fleet-workers
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    http_sd_configs:
      - url: http://host.docker.internal:4000/prod_cctv/api/fleet/prometheus/sd?kind=workers
        refresh_interval: 60s
    # 192.168.19.42:9400 (new-stack test worker on the worker-2 host) reports the SAME physical GPU
    # as 192.168.19.42:8030 but labels it server_id=worker-3-gpu0 -> double-counted worker-2 in
    # avg(gpu_utilization_percent) and gave worker-3 two chart lines. Drop only that mislabeled copy.
    metric_relabel_configs:
      - source_labels: [instance, server_id]
        regex: '192\.168\.19\.42:9400;worker-3-gpu0'
        action: drop

  - job_name: fleet-nodes
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 15s
    http_sd_configs:
      - url: http://host.docker.internal:4000/prod_cctv/api/fleet/prometheus/sd?kind=nodes
        refresh_interval: 60s

  - job_name: gpu-workers
    metrics_path: /metrics
    # 30s interval + 20s timeout tolerates occasional slow nvidia-smi
    # collections under fleet-wide concurrent scraping. The worker-side
    # 10s cache (GPU_STATS_CACHE_TTL) keeps most scrapes cheap.
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      # ──────── worker-0: main server (this host) ────────
      - targets: ['host.docker.internal:8000']
        labels:
          server_id: worker-0

      # ──────── worker-2,3 (+4,5): single-GPU H200 boxes on private LAN ────────
      # Standalone aggregated exporter (:8030) instead of the cctv FastAPI /metrics, which can
      # hang for >20s under load. The exporter sets its own server_id (worker-N-gpu0).
      # worker-1 (192.168.19.43) is stopped and its GPU is used by another team -> not scraped,
      # so it no longer drags the fleet average down (re-add '192.168.19.43:8030' to bring it back).
      - targets: ['192.168.19.42:8030']
      - targets: ['192.168.19.41:8030']
      - targets: ['192.168.19.44:8030']   # worker-4 (server_id worker-4-gpu0)
      - targets: ['192.168.19.46:8030']   # worker-5 (server_id worker-5-gpu0)

  # ── Host system metrics (node_exporter) — CPU / RAM / disk / network ──
  # LAN workers expose node_exporter directly on :9100; the 8-GPU VMs (5/6)
  # reuse the host's existing node_exporter (127.0.0.1:9100), tunneled to
  # main:9108 (w5) and main:9208 (w6) by the cctv-worker-{5,6}-tunnel services.
  - job_name: node-exporter
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['192.168.19.43:9100']
        labels:
          server_id: worker-1
      - targets: ['192.168.19.42:9100']
        labels:
          server_id: worker-2
      - targets: ['192.168.19.41:9100']
        labels:
          server_id: worker-3
      - targets: ['192.168.19.44:9100']
        labels:
          server_id: worker-4
      - targets: ['192.168.19.46:9100']
        labels:
          server_id: worker-5
