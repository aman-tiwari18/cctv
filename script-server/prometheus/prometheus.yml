global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: cctv

scrape_configs:
  - job_name: gpu-workers
    metrics_path: /metrics
    # 30s interval + 20s timeout tolerates occasional slow nvidia-smi
    # collections under fleet-wide concurrent scraping. The worker-side
    # 10s cache (GPU_STATS_CACHE_TTL) keeps most scrapes cheap.
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      # ──────── worker-0: main server (this host) ────────
      - targets: ['host.docker.internal:8000']
        labels:
          server_id: worker-0

      # ──────── worker-1..3: single-GPU H200 boxes on private LAN ────────
      - targets: ['192.168.19.43:8000']
        labels:
          server_id: worker-1
      - targets: ['192.168.19.42:8000']
        labels:
          server_id: worker-2
      - targets: ['192.168.19.41:8000']
        labels:
          server_id: worker-3

      # ──────── worker-4: 8-GPU box via SSH tunnel ────────
      # Reached via local-forward ports on main host (cctv-worker-4-tunnel.service
      # forwards main:9000..9007 -> worker-4:8005..8012).
      - targets: ['host.docker.internal:9000']
        labels:
          server_id: worker-4-gpu0
      - targets: ['host.docker.internal:9001']
        labels:
          server_id: worker-4-gpu1
      - targets: ['host.docker.internal:9002']
        labels:
          server_id: worker-4-gpu2
      - targets: ['host.docker.internal:9003']
        labels:
          server_id: worker-4-gpu3
      - targets: ['host.docker.internal:9004']
        labels:
          server_id: worker-4-gpu4
      - targets: ['host.docker.internal:9005']
        labels:
          server_id: worker-4-gpu5
      - targets: ['host.docker.internal:9006']
        labels:
          server_id: worker-4-gpu6
      - targets: ['host.docker.internal:9007']
        labels:
          server_id: worker-4-gpu7
