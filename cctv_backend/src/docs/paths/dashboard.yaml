/api/dashboard/admin-stats:
  get:
    tags: [Dashboard]
    summary: Admin dashboard statistics (legacy)
    description: |
      Returns aggregate counts (exams, shifts, cameras, detections, executions)
      for the admin dashboard. Supports optional `timeRange` query (e.g. `24h`,
      `7d`, `30d`).

      **Legacy endpoint.** New "CCTV Control Center" dashboard uses
      `/api/dashboard/overview` and `/api/dashboard/live-exams` instead.
    security:
      - bearerAuth: []
    parameters:
      - name: timeRange
        in: query
        required: false
        description: Time window for detection/execution counts.
        schema:
          type: string
          example: 24h
    responses:
      '200':
        description: Aggregate stats
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  additionalProperties: true
                  example:
                    active_exams: 5
                    total_shifts: 20
                    total_cameras: 150
                    detections:
                      total: 1250
                      by_type:
                        movement: 500
                        proximity: 400
                        mobile: 300
                        invigilator: 50
                    executions:
                      pending: 10
                      running: 5
                      completed: 1200
                      failed: 35
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/dashboard/overview:
  get:
    tags: [Dashboard]
    summary: New dashboard — Performance Overview cards + Detection Distribution
    description: |
      Feeds the 4 Performance Overview cards (Total Exams, Cameras, Script
      Breakdown, Total Detections) and the Detection Distribution chart on the
      new "CCTV Control Center" dashboard.

      **V2 semantics (2026-05-21):**
      - `date` (optional) defaults to **today in local server time (IST)**.
      - `total_exams.total` = count of exams where today is in [start_date, end_date] AND is_active=1.
        Big number on UI equals this sub-field — NO all-time total anymore.
      - `total_exams.ongoing` = subset of those exams whose at least one active shift has
        current local time inside `[start_time, end_time]`.
      - Cameras card scoped to exams live on `date`.
      - Scripts card filters `shift_script_assignments.assignment_date = date` (all statuses counted in `planned_today`).
      - Detections card + distribution filter `created_at` to `[date, date+1)`.

      **Invariants:**
      - `cameras.accessible <= cameras.total` and `cameras.unclassified <= cameras.total`
        (independent slices — sum may exceed total).
      - `scripts.running + scheduled + completed <= scripts.planned_today` (FAILED/CANCELLED also exist).
      - `detections.today === detections.pushed_to_client + detections.false_detection`.
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        required: false
        description: Calendar date in `YYYY-MM-DD` (local IST). Defaults to today.
        schema:
          type: string
          format: date
          example: '2026-05-15'
    responses:
      '200':
        description: Aggregated overview for the selected date.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    date: { type: string, format: date, example: '2026-05-15' }
                    total_exams:
                      type: object
                      properties:
                        total:   { type: integer, example: 1, description: 'On-today count (same value as big number on UI).' }
                        ongoing: { type: integer, example: 1, description: 'Currently live by time (current time in any shift window).' }
                    cameras:
                      type: object
                      properties:
                        total:        { type: integer, example: 810 }
                        accessible:   { type: integer, example: 200, description: "LOWER(status) = 'accessible'" }
                        unclassified: { type: integer, example: 0,   description: "classification IS NULL OR classification = ''" }
                    scripts:
                      type: object
                      properties:
                        planned_today: { type: integer, example: 32 }
                        running:       { type: integer, example: 18, description: "status = 'RUNNING'" }
                        scheduled:     { type: integer, example: 10, description: "status = 'PENDING' (UI label 'Scheduled')" }
                        completed:     { type: integer, example: 4,  description: "status = 'COMPLETED'" }
                    detections:
                      type: object
                      properties:
                        today:            { type: integer, example: 43 }
                        pushed_to_client: { type: integer, example: 25 }
                        false_detection:  { type: integer, example: 18 }
                    detection_distribution:
                      type: array
                      items:
                        type: object
                        properties:
                          type:          { type: string, example: entry_exit_detection }
                          count:         { type: integer, example: 1116 }
                          pushed_count:  { type: integer, example: 800 }
                          removed_count: { type: integer, example: 100 }
                          accuracy:      { type: string,  example: '71.68', description: '`pushed_count / count * 100`, fixed to 2 decimals.' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/dashboard/live-exams:
  get:
    tags: [Dashboard]
    summary: New dashboard — Live Exam Table (paginated)
    description: |
      Returns one row per `(exam, shift)` pair where the exam is live by date today
      AND the shift is currently running (current local time inside its
      `[start_time, end_time]` window):
      - `exam.is_active = 1`
      - today (local IST) BETWEEN `exam.start_date` AND `exam.end_date`
      - `exam_shift.is_active = 1`
      - current local time BETWEEN `exam_shift.start_time` AND `exam_shift.end_time`

      **V2.2 (2026-05-21):** the shift's actual time window is the filter, while
      the bracket LABEL (`shift_bracket`) is derived from the CURRENT TIME. So a
      single long shift like 09:00–18:59 is labeled "Morning" at 10:00, "Afternoon"
      at 14:00, "Evening" at 16:00.

      **`shift_bracket` field (display label, derived from current local time):**
      - `'Morning'`   if current time in `[09:00:00, 12:00:00)`
      - `'Afternoon'` if `[12:00:00, 15:00:00)`
      - `'Evening'`   if `[15:00:00, 18:00:00)`
      - `null` if outside `[09:00, 18:00)`

      **Per-row counts:**
      - `cameras` — total cameras for that exam (HLS scoped to shift; RTSP per exam).
        HLS rows with `shift_id IS NULL` apply to all shifts.
      - `scripts` — `COUNT(*)` of `shift_script_assignments` for this `shift_id` today (is_active=TRUE).
      - `detections` — `COUNT(*)` of today's detections for `(exam_id, shift_id)`.

      **Invariants:**
      - `total_pages === Math.ceil(total / limit)` when limit > 0, else 0.
      - Every returned row has `shift_start <= nowTime <= shift_end` per the SQL filter.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        description: 1-indexed page number.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Rows per page (max 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: exam_id
        in: query
        required: false
        description: Optional filter to a single exam.
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Paginated live (exam, shift) rows.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    page:        { type: integer, example: 1 }
                    limit:       { type: integer, example: 10 }
                    total:       { type: integer, example: 1, description: Total matching rows (across all pages). }
                    total_pages: { type: integer, example: 1 }
                    rows:
                      type: array
                      items:
                        type: object
                        properties:
                          exam_id:       { type: integer, example: 22 }
                          shift_id:      { type: integer, example: 105 }
                          date:          { type: string,  format: date, example: '2026-05-21' }
                          exam_name:     { type: string,  example: 'test' }
                          shift_name:    { type: string,  example: 'Shift 1' }
                          link_type:     { type: string,  enum: [HLS, RTSP], example: RTSP }
                          shift_bracket: { type: string,  enum: [Morning, Afternoon, Evening], nullable: true, example: Afternoon, description: 'Display label derived from the CURRENT local time (not the shifts start_time). null if current time is outside 09:00-18:00.' }
                          shift_start:   { type: string,  example: '09:00:00', description: 'TIME from exam_shifts.start_time' }
                          shift_end:     { type: string,  example: '12:00:00', description: 'TIME from exam_shifts.end_time' }
                          cameras:       { type: integer, example: 810 }
                          scripts:       { type: integer, example: 26, description: 'Count of script assignments for this shift today.' }
                          detections:    { type: integer, example: 5391, description: 'COUNT of today detections for (exam, shift). Admin: all detections. Client: pushed_to_client=1 only.' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'
