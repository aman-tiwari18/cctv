/api/client-dashboard/stats:
  get:
    tags: [Client Dashboard]
    summary: Client dashboard statistics
    description: Aggregate stats grouped by `exam_body` (e.g. SSC, TCS, EY, CDIS).
    responses:
      '200':
        description: Per-exam_body stats payload.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    example:
                      exam_body: SSC
                      total_exams: 5
                      total_cameras: 120
                      detections_total: 432
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/client-dashboard/camera-accessibility:
  get:
    tags: [Client Dashboard]
    summary: Camera accessibility statistics
    description: |
      Returns counts of cameras grouped by accessibility classification
      (e.g. SAFE, SUSPICIOUS, NOT_ACCESSIBLE) per exam_body / centre.
    responses:
      '200':
        description: Accessibility breakdown.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/client-dashboard/camera-accessibility/download:
  get:
    tags: [Client Dashboard]
    summary: Download camera accessibility report (Excel)
    description: Returns an `.xlsx` workbook with the accessibility breakdown.
    responses:
      '200':
        description: Excel workbook (.xlsx).
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/client-dashboard/exam-body/{examBody}/details:
  get:
    tags: [Client Dashboard]
    summary: Detailed stats for a specific exam body
    parameters:
      - $ref: '#/components/parameters/ExamBodyPath'
    responses:
      '200':
        description: Detailed stats for the given exam_body.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  additionalProperties: true
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'

/api/client-dashboard/overview:
  get:
    tags: [Client Dashboard]
    summary: New client dashboard — Performance Overview cards + Detection Distribution (company-scoped)
    description: |
      Client (company-scoped) version of `GET /api/dashboard/overview`. Returns the
      same response shape, but data is filtered to the requesting user's company.

      **Company-scoping behavior:**
      - **ADMIN** — sees all exams (no filter).
      - **VIEWER with `company_name = 'EY'`** — sees exams where `exam_body IN ('SSC', 'TCS')`.
      - **VIEWER with any other `company_name`** — sees exams where `exam_body = company_name`
        (e.g. a TCS viewer sees only TCS exams).

      **V2 semantics (2026-05-21):**
      - `date` defaults to today in local server time (IST).
      - `total_exams.total` = count of company exams where today is in [start_date, end_date].
        Big number on UI equals this sub-field — NO all-time total.
      - `total_exams.ongoing` = subset whose at least one active shift has current local time
        inside `[start_time, end_time]`.
      - Cameras card scoped to company exams live on `date`.
      - Scripts card filters `shift_script_assignments.assignment_date = date` AND joins
        through `exam_shifts` to apply the company filter.
      - Detections card + distribution filter `created_at` to `[date, date+1)`.

      **Client visibility rule (DIFFERS from admin endpoint):**
      Clients can only see detections that were pushed to them (`pushed_to_client = 1`).
      Untriaged or never-pushed detections are invisible. Within the pushed set:
      - `detections.pushed_to_client` = pushed AND still showing (`remove_from_client = 0`)
      - `detections.false_detection`  = pushed but later retracted (`remove_from_client = 1`)
      - `detections.today`            = pushed_to_client + false_detection (entire pushed set)
      Same shape applies to `detection_distribution[*]`: `pushed_count` = still showing,
      `removed_count` = retracted, `count` = both combined.

      **Invariants (must hold):**
      - `cameras.accessible <= cameras.total` and `cameras.unclassified <= cameras.total`
        (independent slices — sum may exceed total).
      - `scripts.running + scheduled + completed <= scripts.planned_today`.
      - `detections.today === detections.pushed_to_client + detections.false_detection`.
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        required: false
        description: Calendar date in `YYYY-MM-DD` (local IST). Defaults to today.
        schema:
          type: string
          format: date
          example: '2026-05-18'
    responses:
      '200':
        description: Aggregated overview for the selected date, scoped to the user's company.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    date: { type: string, format: date, example: '2026-05-18' }
                    total_exams:
                      type: object
                      properties:
                        total:   { type: integer, example: 1, description: 'On-today count, company-scoped (same as big number on UI).' }
                        ongoing: { type: integer, example: 1, description: 'Currently live by time within the company.' }
                    cameras:
                      type: object
                      properties:
                        total:        { type: integer, example: 810 }
                        accessible:   { type: integer, example: 200, description: "LOWER(status) = 'accessible'" }
                        unclassified: { type: integer, example: 0,   description: "classification IS NULL OR classification = ''" }
                    scripts:
                      type: object
                      properties:
                        planned_today: { type: integer, example: 2 }
                        running:       { type: integer, example: 2, description: "status = 'RUNNING'" }
                        scheduled:     { type: integer, example: 0, description: "status = 'PENDING' (UI label 'Scheduled')" }
                        completed:     { type: integer, example: 0, description: "status = 'COMPLETED'" }
                    detections:
                      type: object
                      properties:
                        today:            { type: integer, example: 0 }
                        pushed_to_client: { type: integer, example: 0 }
                        false_detection:  { type: integer, example: 0 }
                    detection_distribution:
                      type: array
                      items:
                        type: object
                        properties:
                          type:          { type: string, example: server_room_detection }
                          count:         { type: integer, example: 2 }
                          pushed_count:  { type: integer, example: 0 }
                          removed_count: { type: integer, example: 0 }
                          accuracy:      { type: string,  example: '0.00', description: '`pushed_count / count * 100`, fixed to 2 decimals.' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

/api/client-dashboard/live-exams:
  get:
    tags: [Client Dashboard]
    summary: New client dashboard — Live Exam Table (paginated, company-scoped)
    description: |
      Client (company-scoped) version of `GET /api/dashboard/live-exams`. Returns one
      row per `(exam, shift)` pair where exam is live by date today AND belongs to the
      user's company:
      - `exam.is_active = 1`
      - today (local IST) BETWEEN `exam.start_date` AND `exam.end_date`
      - `exam_shift.is_active = 1`
      - PLUS company filter on `exams.exam_body` (see below)

      **V2.1 (2026-05-21):** NO time-of-day filter. All shifts of a live-by-date exam
      appear regardless of current clock time.

      **`shift_bracket` field (display label):** computed per-row from `start_time`:
      `'Morning'` for `[09:00, 12:00)`, `'Afternoon'` for `[12:00, 15:00)`,
      `'Evening'` for `[15:00, 18:00)`, `null` otherwise. Display label only.

      **Company filter:**
      - **ADMIN** — sees all live (exam, shift) rows.
      - **VIEWER with `company_name = 'EY'`** — sees only `exam_body IN ('SSC', 'TCS')`.
      - **VIEWER with other `company_name`** — sees only `exam_body = <their company>`.

      If a client passes `?exam_id=` of an exam not in their company, the response
      is `total: 0, rows: []` — the company filter naturally rejects it.

      **Per-row counts (identical shape to admin, but `detections` is client-visible only):**
      - `cameras` — total cameras for that exam (HLS scoped to shift; RTSP per exam).
        HLS rows with `shift_id IS NULL` apply to all shifts.
      - `scripts` — `COUNT(*)` of `shift_script_assignments` for this `shift_id` today.
      - `detections` — today's detections for `(exam_id, shift_id)` **filtered to
        `pushed_to_client = 1`** (the client only sees pushed detections).

      **Invariants:**
      - `total_pages === Math.ceil(total / limit)` when limit > 0, else 0.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        description: 1-indexed page number.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Rows per page (max 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: exam_id
        in: query
        required: false
        description: Optional filter to a single exam (must be in user's company, otherwise zero rows).
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Paginated live (exam, shift) rows, scoped to the user's company.
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    page:        { type: integer, example: 1 }
                    limit:       { type: integer, example: 10 }
                    total:       { type: integer, example: 1 }
                    total_pages: { type: integer, example: 1 }
                    rows:
                      type: array
                      items:
                        type: object
                        properties:
                          exam_id:       { type: integer, example: 22 }
                          shift_id:      { type: integer, example: 105 }
                          date:          { type: string,  format: date, example: '2026-05-21' }
                          exam_name:     { type: string,  example: 'test' }
                          shift_name:    { type: string,  example: 'Shift 1' }
                          link_type:     { type: string,  enum: [HLS, RTSP], example: RTSP }
                          shift_bracket: { type: string,  enum: [Morning, Afternoon, Evening], nullable: true, example: Morning, description: 'Display label only. null if start_time is outside 09:00-18:00.' }
                          shift_start:   { type: string,  example: '09:00:00' }
                          shift_end:     { type: string,  example: '12:00:00' }
                          cameras:       { type: integer, example: 810 }
                          scripts:       { type: integer, example: 26 }
                          detections:    { type: integer, example: 200, description: 'Client-visible only (pushed_to_client=1).' }
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'
