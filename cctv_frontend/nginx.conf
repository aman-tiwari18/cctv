server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API
    location /cctv_analytics/api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Script server Socket.IO. The public path is /cctv_dev/socket.io,
    # but the FastAPI/Socket.IO app listens at /socket.io internally.
    location /cctv_dev/socket.io {
        proxy_pass http://script-server:8000/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Script server REST and image endpoints.
    location /cctv_dev/ {
        rewrite ^/cctv_dev/?(.*)$ /$1 break;
        proxy_pass http://script-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TC Video Upload Service (standalone microservice on p010).
    # Browser → /video-upload/… → nginx → http://100.81.36.13:8080/…
    # Large body + long timeouts because videos can be up to 64 GB.
    location /video-upload/ {
        rewrite ^/video-upload/?(.*)$ /$1 break;
        proxy_pass http://100.81.36.13:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload limits — up to 64 GB per file
        client_max_body_size 65536m;

        # Long timeouts for large uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable request buffering — stream directly to the upstream
        proxy_request_buffering off;
    }

    location = /cctv_analytics {
        return 301 /cctv_analytics/;
    }

    # Hashed Vite assets must either be served as JS/CSS or return 404.
    # Falling back to index.html here makes dynamic imports fail with a
    # misleading module-fetch error.
    location ^~ /cctv_analytics/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle React Router under the production base path.
    location ^~ /cctv_analytics/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Handle React Router for deployments mounted at /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable logging for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
